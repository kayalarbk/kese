<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0B1B3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Kese</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
<style>
/* ===================================================================
   DESIGN TOKENS — tek kaynak. Hicbir yerde hard-coded renk yok.
   =================================================================== */
:root{
  --navy-900:#0B1B3A;
  --navy-800:#14264A;
  --navy-600:#24406F;
  --accent:#3B6FD4;
  --accent-soft:#E8EFFB;
  --bg:#F6F8FC;
  --surface:#FFFFFF;
  --border:#E3E8F1;
  --text:#16233F;
  --text-muted:#6B7A99;
  --success:#1F9D74;
  --danger:#D64545;
  --warning:#E0A030;

  --shadow:0 2px 8px rgba(11,27,58,.06);
  --shadow-lg:0 8px 24px rgba(11,27,58,.12);
  --fill-quiet:#EDF1F8;
  --fill-disabled:#C7D3E8;
  --danger-soft:#FAE9E9;
  --success-soft:#E6F4EF;

  --r-card:12px;
  --r-input:8px;
  --r-pill:999px;

  /* 4/8 spacing */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;

  /* type scale: 12/14/16/20/28 */
  --t-xs:12px; --t-sm:14px; --t-md:16px; --t-lg:20px; --t-xl:28px;

  --font:"Inter",system-ui,-apple-system,sans-serif;
  --nav-h:60px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--font);font-size:var(--t-sm);line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + var(--safe-b));
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit;margin:0}
button{background:none;border:0;cursor:pointer;text-align:left}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ===================== BASLIK ===================== */
.appbar{
  position:sticky;top:0;z-index:30;
  background:var(--navy-900);color:#fff;
  padding:calc(var(--safe-t) + var(--s4)) var(--s4) var(--s4);
  display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
}
.appbar h1{font-size:var(--t-md);font-weight:700;margin:0;letter-spacing:.02em}
.appbar .sub{font-size:var(--t-xs);color:#A9BBDC;margin-top:2px}
.pill{
  font-size:var(--t-xs);font-weight:600;color:#CFDCF3;
  background:var(--navy-600);border-radius:var(--r-pill);
  padding:var(--s1) var(--s3);white-space:nowrap;
}

main{padding:var(--s4);max-width:560px;margin:0 auto}
.screen{display:none}
.screen.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ===================== BILESENLER ===================== */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-card);box-shadow:var(--shadow);
  padding:var(--s4);
}
.card + .card{margin-top:var(--s3)}

.sec{display:flex;align-items:center;justify-content:space-between;margin:var(--s6) var(--s1) var(--s3)}
.sec:first-child{margin-top:0}
.sec h2{font-size:var(--t-md);font-weight:700;margin:0}
.sec .hint{font-size:var(--t-xs);color:var(--text-muted);font-weight:500}

.lbl{display:block;font-size:var(--t-xs);font-weight:600;color:var(--text-muted);margin-bottom:var(--s2)}

.inp{
  width:100%;min-height:48px;padding:0 var(--s3);
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-input);outline:none;font-size:var(--t-md);
}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{padding:var(--s3);min-height:48px;resize:none}
select.inp{appearance:none;background-image:none;padding-right:var(--s8)}
.selwrap{position:relative}
.selwrap .chev{position:absolute;right:var(--s3);top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none}

.seg{display:grid;gap:var(--s1);background:var(--fill-quiet);border-radius:10px;padding:var(--s1)}
.seg button{
  min-height:44px;border-radius:var(--r-input);text-align:center;
  font-size:var(--t-sm);font-weight:600;color:var(--text-muted);
  display:flex;align-items:center;justify-content:center;gap:var(--s2);
  transition:background .15s,color .15s;
}
.seg button.on{background:var(--surface);color:var(--navy-900);box-shadow:0 1px 3px rgba(11,27,58,.12)}

.btn{
  width:100%;min-height:48px;border-radius:10px;
  background:var(--accent);color:#fff;
  font-size:var(--t-md);font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:var(--s2);
  transition:opacity .15s,transform .1s;
}
.btn:active{transform:scale(.99)}
.btn[disabled]{background:var(--fill-disabled);pointer-events:none}
.btn.sec{background:var(--surface);border:1px solid var(--border);color:var(--text)}
.btn.dang{background:var(--surface);border:1px solid #F1C9C9;color:var(--danger)}

.icon{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.icon.sm{width:16px;height:16px}
.icon.lg{width:24px;height:24px}
.cdot{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.field{margin-bottom:var(--s4)}
.field:last-child{margin-bottom:0}

/* ===================== OZET ===================== */
.ringcard{display:flex;flex-direction:column;align-items:center;padding:var(--s5) var(--s4)}
.ringwrap{position:relative;width:210px;height:210px}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.rtrack{fill:none;stroke:var(--fill-quiet);stroke-width:16}
.rseg{fill:none;stroke-width:16;transition:stroke-dasharray .45s cubic-bezier(.3,1,.4,1)}
.rpace{stroke:var(--navy-900);stroke-width:2;opacity:.45}
.rcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s1)}
.rcenter .cap{font-size:var(--t-xs);font-weight:600;color:var(--text-muted)}
.rcenter .big{font-size:var(--t-xl);font-weight:700}
.rcenter .big.over{color:var(--danger)}
.rcenter .sub{font-size:var(--t-xs);color:var(--text-muted)}
.pacebar{
  margin-top:var(--s4);display:flex;align-items:center;gap:var(--s2);
  font-size:var(--t-xs);font-weight:600;
  padding:var(--s2) var(--s3);border-radius:var(--r-pill);background:var(--fill-quiet);
}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);margin-top:var(--s3)}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow);padding:var(--s3) var(--s2);text-align:center}
.tile b{display:block;font-size:var(--t-md);font-weight:700}
.tile span{display:block;font-size:var(--t-xs);color:var(--text-muted);margin-top:2px}
.tile b.pos{color:var(--success)} .tile b.neg{color:var(--danger)}

/* kategori satiri */
.crow{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.crow:last-child{border-bottom:0;padding-bottom:0}
.crow:first-child{padding-top:0}
.crow .nm{font-size:var(--t-sm);font-weight:600;margin-bottom:var(--s1)}
.track{height:6px;border-radius:var(--r-pill);background:var(--fill-quiet);overflow:hidden}
.fill{height:100%;border-radius:var(--r-pill);transition:width .4s ease}
.crow .amt{font-size:var(--t-sm);font-weight:700;text-align:right}
.crow .pct{font-size:var(--t-xs);color:var(--text-muted);text-align:right}

/* ===================== ISLEM LISTESI ===================== */
.daygroup{margin-bottom:var(--s4)}
.dayhead{display:flex;justify-content:space-between;padding:0 var(--s1) var(--s2);font-size:var(--t-xs);font-weight:600;color:var(--text-muted)}
.tx{
  display:grid;grid-template-columns:36px 1fr auto 44px;align-items:center;gap:var(--s3);
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);
  box-shadow:var(--shadow);padding:var(--s3);margin-bottom:var(--s2);
  animation:fade .18s ease;
}
.tx .nm{font-size:var(--t-sm);font-weight:600}
.tx .meta{display:flex;align-items:center;gap:var(--s1);font-size:var(--t-xs);color:var(--text-muted);margin-top:2px}
.tx .amt{font-size:var(--t-sm);font-weight:700}
.tx .amt.in{color:var(--success)}
.txdel{width:44px;height:44px;display:grid;place-items:center;color:var(--text-muted);border-radius:var(--r-input)}
.txdel:active{color:var(--danger);background:var(--danger-soft)}

.empty{text-align:center;padding:var(--s8) var(--s5);border:1px dashed var(--border);border-radius:var(--r-card);background:var(--surface)}
.empty .cdot{margin:0 auto var(--s3);background:var(--fill-quiet);color:var(--text-muted);width:44px;height:44px}
.empty b{display:block;font-size:var(--t-sm);margin-bottom:var(--s1)}
.empty span{font-size:var(--t-xs);color:var(--text-muted)}

/* ===================== EKLE ===================== */
.hero{
  background:linear-gradient(135deg,var(--navy-900),var(--navy-600));
  border-radius:var(--r-card);padding:var(--s5) var(--s4);color:#fff;
  box-shadow:var(--shadow);
}
.hero .lbl{color:#A9BBDC;margin-bottom:var(--s2)}
.heroin{display:flex;align-items:baseline;gap:var(--s2)}
.heroin input{
  flex:1;min-width:0;background:none;border:0;outline:none;color:#fff;
  font-size:36px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  padding:0;
}
.heroin input::placeholder{color:rgba(255,255,255,.35)}
.heroin .cur{font-size:var(--t-lg);font-weight:600;color:#A9BBDC}

.suggrow{display:flex;gap:var(--s2);overflow-x:auto;padding:var(--s1) 0 var(--s2);scrollbar-width:none}
.suggrow::-webkit-scrollbar{display:none}
.sugg{
  flex:none;min-height:44px;display:flex;align-items:center;gap:var(--s2);
  padding:0 var(--s3);border-radius:var(--r-pill);white-space:nowrap;
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);
  font-size:var(--t-sm);font-weight:600;
}
.sugg .v{font-size:var(--t-xs);color:var(--text-muted);font-variant-numeric:tabular-nums}
.sugg:active{border-color:var(--accent)}

.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2)}
.ccell{
  min-height:76px;padding:var(--s2) var(--s1);
  border:1px solid var(--border);border-radius:var(--r-card);background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s1);
  font-size:var(--t-xs);color:var(--text-muted);text-align:center;line-height:1.2;
  transition:border-color .15s,background .15s;
}
.ccell.on{border-color:var(--accent);background:var(--accent-soft);color:var(--navy-900);font-weight:600}
.ccell .cdot{width:32px;height:32px}

.savebar{
  position:sticky;bottom:calc(var(--nav-h) + var(--safe-b));
  padding:var(--s3) 0 var(--s2);
  background:linear-gradient(to top,var(--bg) 70%,transparent);
  z-index:10;
}

/* ===================== ISTATISTIK ===================== */
.rangebar{
  position:sticky;top:calc(var(--safe-t) + 56px);z-index:20;
  background:var(--bg);padding:var(--s2) 0 var(--s3);margin:0 0 var(--s1);
}
.rangebar .seg{grid-template-columns:repeat(5,1fr)}
.rangebar .seg button{font-size:var(--t-xs);padding:0 var(--s1);min-height:40px}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow);padding:var(--s3)}
.kpi .k{font-size:var(--t-xs);color:var(--text-muted);display:flex;align-items:center;gap:var(--s1)}
.kpi .v{font-size:var(--t-lg);font-weight:700;margin-top:var(--s1)}
.kpi .v.sm{font-size:var(--t-md)}
.trend{display:inline-flex;align-items:center;gap:2px;font-size:var(--t-xs);font-weight:700;padding:2px 6px;border-radius:var(--r-pill)}
.trend.up{background:var(--danger-soft);color:var(--danger)}
.trend.down{background:var(--success-soft);color:var(--success)}
.trend.flat{background:var(--fill-quiet);color:var(--text-muted)}

.chartbox{position:relative;height:220px}
.chartbox.short{height:150px}
.chartbox.tall{height:240px}

.legend{margin-top:var(--s4)}
.lg{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) 0;border-bottom:1px solid var(--border);font-size:var(--t-sm)}
.lg:last-child{border-bottom:0}
.lg .sw{width:10px;height:10px;border-radius:3px;flex:none}
.lg .nm{flex:1}
.lg .v{font-weight:700;font-variant-numeric:tabular-nums}
.lg .p{font-size:var(--t-xs);color:var(--text-muted);width:40px;text-align:right}

.wtop{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.wtop b{font-size:var(--t-xl);font-weight:700}
.wsub{font-size:var(--t-xs);color:var(--text-muted);margin-top:var(--s1)}
.wrow{display:flex;justify-content:space-between;align-items:center;padding:var(--s3) 0;border-top:1px solid var(--border);font-size:var(--t-sm)}
.wrow .k{display:flex;align-items:center;gap:var(--s2)}
.wrow .k .cdot{width:28px;height:28px}
.wrow .v{font-weight:700;font-variant-numeric:tabular-nums;margin-right:var(--s2)}

/* ===================== AYARLAR ===================== */
.list{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
.li{
  display:flex;align-items:center;gap:var(--s3);width:100%;
  min-height:56px;padding:var(--s2) var(--s4);
  border-bottom:1px solid var(--border);font-size:var(--t-sm);
}
.li:last-child{border-bottom:0}
.li .nm{flex:1;font-weight:600}
.li .val{color:var(--text-muted);font-size:var(--t-xs)}
.swatches{display:flex;flex-wrap:wrap;gap:var(--s2)}
.sw-btn{width:44px;height:44px;border-radius:var(--r-input);display:grid;place-items:center;border:2px solid transparent}
.sw-btn i{display:block;width:24px;height:24px;border-radius:6px}
.sw-btn.on{border-color:var(--navy-900)}
.icgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--s2)}
.ic-btn{height:44px;border-radius:var(--r-input);border:1px solid var(--border);display:grid;place-items:center;color:var(--text-muted)}
.ic-btn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

/* ===================== ALT MENU ===================== */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);
  background:var(--navy-900);display:grid;grid-template-columns:repeat(4,1fr);
}
.nav button{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:#7E93BC;font-size:11px;font-weight:600;min-height:44px;
}
.nav button.on{color:#fff}
.nav button.on .icon{stroke-width:2}

/* ===================== KATMANLAR ===================== */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(11,27,58,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:560px;margin:0 auto;
  background:var(--surface);border-radius:16px 16px 0 0;
  padding:var(--s3) var(--s4) calc(var(--s5) + var(--safe-b));
  transform:translateY(101%);transition:transform .24s cubic-bezier(.3,1,.4,1);
  max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);
}
.sheet.on{transform:none}
.grab{width:36px;height:4px;border-radius:var(--r-pill);background:var(--border);margin:0 auto var(--s4)}
.sheet h3{font-size:var(--t-md);font-weight:700;margin:0 0 var(--s4)}

.dialog{
  position:fixed;left:var(--s4);right:var(--s4);top:50%;transform:translateY(-46%) scale(.97);
  max-width:340px;margin:0 auto;z-index:52;
  background:var(--surface);border-radius:var(--r-card);padding:var(--s5);
  box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.18s;
}
.dialog.on{opacity:1;pointer-events:auto;transform:translateY(-50%) scale(1)}
.dialog h4{margin:0 0 var(--s2);font-size:var(--t-md)}
.dialog p{margin:0 0 var(--s5);font-size:var(--t-sm);color:var(--text-muted)}

.toast{
  position:fixed;left:var(--s4);right:var(--s4);bottom:calc(var(--nav-h) + var(--safe-b) + var(--s4));
  max-width:520px;margin:0 auto;z-index:60;
  background:var(--navy-900);color:#fff;border-radius:10px;
  padding:var(--s3) var(--s4);font-size:var(--t-sm);font-weight:500;
  display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
  box-shadow:var(--shadow-lg);
  opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;
}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.toast button{color:#8FB4F5;font-weight:700;min-height:44px;display:flex;align-items:center}

/* ===================== ISKELET ===================== */
.sk{background:linear-gradient(90deg,var(--fill-quiet) 25%,#F7F9FD 50%,var(--fill-quiet) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:var(--r-card)}
@keyframes shimmer{to{background-position:-200% 0}}
#boot{padding:var(--s4);max-width:560px;margin:0 auto}

@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="icondefs"></defs></svg>

<header class="appbar">
  <div><h1 id="barTitle">Kese</h1><div class="sub" id="barSub">Harcama defteri</div></div>
  <div class="pill" id="barPill">—</div>
</header>

<div id="boot">
  <div class="sk" style="height:250px"></div>
  <div class="sk" style="height:72px;margin-top:12px"></div>
  <div class="sk" style="height:180px;margin-top:12px"></div>
</div>

<main id="app" hidden>
  <!-- ================= OZET ================= -->
  <section class="screen on" id="s-ozet">
    <div class="card ringcard">
      <div class="ringwrap">
        <svg viewBox="0 0 210 210">
          <circle class="rtrack" cx="105" cy="105" r="88"></circle>
          <g id="ringSegs"></g>
          <line class="rpace" id="ringPace" x1="105" y1="9" x2="105" y2="25"></line>
        </svg>
        <div class="rcenter">
          <div class="cap" id="ringCap">Kalan</div>
          <div class="big num" id="ringBig">—</div>
          <div class="sub num" id="ringSub">—</div>
        </div>
      </div>
      <div class="pacebar"><span class="dot" id="paceDot"></span><span id="paceText">—</span></div>
    </div>

    <div class="tiles">
      <div class="tile"><b class="num pos" id="tIncome">—</b><span>Gelir</span></div>
      <div class="tile"><b class="num neg" id="tExpense">—</b><span>Gider</span></div>
      <div class="tile"><b class="num" id="tNet">—</b><span>Net</span></div>
    </div>

    <div class="sec"><h2>Bu ayın seyri</h2><span class="hint" id="trendHint"></span></div>
    <div class="card"><div class="chartbox short"><canvas id="chTrend"></canvas></div></div>

    <div class="sec"><h2>Kategoriler</h2><span class="hint" id="catHint"></span></div>
    <div id="catBreak"></div>

    <div class="sec"><h2>Son işlemler</h2></div>
    <div id="recent"></div>
  </section>

  <!-- ================= EKLE ================= -->
  <section class="screen" id="s-ekle">
    <div class="hero">
      <label class="lbl" for="fAmount">Tutar</label>

/* ---------- DONEM MATEMATIGI ---------- */
function weekStart(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function periodStart(d,p){return p==='weekly'?weekStart(d):new Date(d.getFullYear(),d.getMonth(),1);}
function periodEnd(s,p){const e=new Date(s);p==='weekly'?e.setDate(e.getDate()+7):e.setMonth(e.getMonth()+1);return e;}
function shiftPeriod(s,p,n){const d=new Date(s);p==='weekly'?d.setDate(d.getDate()+7*n):d.setMonth(d.getMonth()+n);return d;}
function periodLabel(s,p){
  if(p==='weekly'){const e=new Date(s);e.setDate(e.getDate()+6);
    return s.getDate()+(e.getMonth()===s.getMonth()?'':' '+AYK[s.getMonth()])+'–'+e.getDate()+' '+AYK[e.getMonth()];}
  return AYLAR[s.getMonth()]+' '+s.getFullYear();
}
const inR=(ts,a,b)=>{const t=new Date(ts).getTime();return t>=a.getTime()&&t<b.getTime();};

function currentPeriod(){const p=S.settings.period,s=periodStart(new Date(),p);return{start:s,end:periodEnd(s,p),p};}
function dataSpanDays(){
  if(!S.expenses.length)return 0;
  const f=Math.min(...S.expenses.map(e=>+new Date(e.ts.slice(0,10)+'T00:00:00')));
  return Math.floor((Date.now()-f)/DAY)+1;
}

/* ---------- MIGRATION ---------- */
function migrate(){
  const seed=S.settings.catSeed||1;

  /* 1.x -> 2.0 : kategori setini genislet, emoji ikonlari isim tabanli ikona cevir */
  if(seed<3){
    const mine=S.categories||[];
    const merged=[];
    DEFAULTS.categories.forEach(d=>{
      const own=mine.find(c=>c.id===d.id);
      if(own){
        if(!ICONS[own.icon]) own.icon=EMOJI_MAP[own.icon]||d.icon;
        if(!own.kind) own.kind=d.kind;
        if(!/^#[0-9A-Fa-f]{6}$/.test(own.color)) own.color=d.color;
        merged.push(own);
      } else merged.push({...d});
    });
    mine.forEach(c=>{
      if(merged.some(m=>m.id===c.id))return;
      if(!ICONS[c.icon]) c.icon=EMOJI_MAP[c.icon]||'tag';
      if(!c.kind) c.kind='expense';
      merged.push(c);
    });
    S.categories=merged;
    S.settings.catSeed=3;
  }

  /* islem semasi: paymentMethod + type + cardId. Hicbir kayit silinmez. */
  let touched=0;
  S.expenses.forEach(e=>{
    if(!e.paymentMethod){e.paymentMethod='card';touched++;}
    if(!e.type){e.type='expense';touched++;}
    if(e.cardId===undefined)e.cardId='';
    if(e.repeat===undefined)e.repeat='none';
  });
  if(!Array.isArray(S.settings.cards))S.settings.cards=[];
  return touched;
}

/* ------------------------- OZET ------------------------- */
function drawOzet(){
  const {start,end}=currentPeriod();
  const all=txIn(start,end), items=all.filter(isExp);
  const budget=S.settings.budget, spent=sum(items);
  const income=sum(all.filter(e=>!isExp(e)));

  const byCat={};items.forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+e.amount);
  const parts=Object.entries(byCat).map(([id,v])=>({c:catById(id),v})).sort((a,b)=>b.v-a.v);

  const over=budget>0&&spent>budget;
  const base=budget>0?(over?spent:budget):Math.max(spent,1);
  const g=$('#ringSegs');g.innerHTML='';let off=0;
  parts.forEach(p=>{
    const len=(p.v/base)*CIRC;
    const el=document.createElementNS('http://www.w3.org/2000/svg','circle');
    el.setAttribute('class','rseg');el.setAttribute('cx',105);el.setAttribute('cy',105);el.setAttribute('r',R);
    el.setAttribute('stroke',p.c.color);
    el.setAttribute('stroke-dasharray',Math.max(len-1.5,0)+' '+CIRC);
    el.setAttribute('stroke-dashoffset',-off);
    g.appendChild(el);off+=len;
  });

  if(budget<=0){
    $('#ringCap').textContent='Harcanan';$('#ringBig').textContent=money(spent);
    $('#ringBig').classList.remove('over');$('#ringSub').textContent='Bütçe belirlenmedi';
  }else if(over){
    $('#ringCap').textContent='Bütçe aşımı';$('#ringBig').textContent='+'+money(spent-budget);
    $('#ringBig').classList.add('over');$('#ringSub').textContent=money(spent)+' / '+money(budget);
  }else{
    $('#ringCap').textContent='Kalan';$('#ringBig').textContent=money(budget-spent);
    $('#ringBig').classList.remove('over');$('#ringSub').textContent=money(spent)+' harcandı';
  }

  const now=new Date(),total=end-start,el=Math.min(Math.max(now-start,0),total),frac=el/total;
  $('#ringPace').setAttribute('transform','rotate('+(frac*360)+' 105 105)');
  const dot=$('#paceDot'),txt=$('#paceText');
  if(budget<=0){dot.style.background='var(--text-muted)';txt.textContent='Tempo için bütçe gerekiyor';}
  else{
    const d=spent-budget*frac;
    if(Math.abs(d)<budget*.03){dot.style.background='var(--accent)';txt.textContent='Tam tempoda';}
    else if(d>0){dot.style.background='var(--danger)';txt.textContent='Tempo üstünde · '+money(d)+' fazla';}
    else{dot.style.background='var(--success)';txt.textContent='Tempo altında · '+money(-d)+' önde';}
  }

  $('#tIncome').textContent=moneyC(income);
  $('#tExpense').textContent=moneyC(spent);
  const net=income-spent;
  const nEl=$('#tNet');nEl.textContent=moneyC(net);
  nEl.className='num '+(net>0?'pos':net<0?'neg':'');

  $('#catHint').textContent=parts.length?parts.length+' kategori':'';
  $('#catBreak').innerHTML=parts.length
    ? '<div class="card">'+parts.map(p=>`
        <div class="crow">
          <span class="cdot" style="background:${p.c.color}1A;color:${p.c.color}">${svgIcon(p.c.icon)}</span>
          <span><span class="nm">${esc(p.c.name)}</span>
            <span class="track"><span class="fill" style="width:${p.v/parts[0].v*100}%;background:${p.c.color}"></span></span>
          </span>
          <span><span class="amt num">${money(p.v)}</span><span class="pct num">%${spent?Math.round(p.v/spent*100):0}</span></span>
        </div>`).join('')+'</div>'
    : emptyState('inbox','Bu dönem boş','Ekle sekmesinden ilk işlemini kaydet.');

  const last=[...S.expenses].sort((a,b)=>b.ts.localeCompare(a.ts)).slice(0,5);
  $('#recent').innerHTML=last.length?txListHTML(last):emptyState('inbox','Kayıt yok','Kaydettiğin işlemler burada görünür.');

  drawTrendChart(start,end);
}

/* islem listesi */
function txListHTML(list){
  const groups={};
  list.forEach(e=>{const k=e.ts.slice(0,10);(groups[k]=groups[k]||[]).push(e);});
  return Object.entries(groups).sort((a,b)=>b[0].localeCompare(a[0])).map(([k,items])=>{
    const net=items.reduce((t,e)=>t+(isExp(e)?e.amount:0),0);
    return `<div class="daygroup">
      <div class="dayhead"><span>${dayLabel(k)}</span><span class="num">${money(net)}</span></div>
      ${items.sort((a,b)=>b.ts.localeCompare(a.ts)).map(txHTML).join('')}
    </div>`;
  }).join('');
}
function dayLabel(k){
  const d=new Date(k+'T00:00:00'),t=iso(new Date()),y=new Date();y.setDate(y.getDate()-1);
  if(k===t)return 'Bugün';
  if(k===iso(y))return 'Dün';
  return d.getDate()+' '+AYLAR[d.getMonth()]+' '+GUNK[d.getDay()];
}
function txHTML(e){
  const c=catById(e.cat),inc=!isExp(e);
  const card=cardById(e.cardId);
  const payIc=e.paymentMethod==='cash'?'cash':'card';
  const payTxt=e.paymentMethod==='cash'?'Nakit':(card?card.name:'Kart');

    <span class="cdot" style="background:${c.color}1A;color:${c.color}">${svgIcon(c.icon)}</span>
    <span>
      <span class="nm">${esc(e.note||c.name)}</span>

/* ------------------------- EKLE ------------------------- */
function suggestions(limit){
  const now=Date.now(),M30=30*DAY,g={};
  S.expenses.filter(isExp).forEach(e=>{
    const key=e.cat+'|'+(e.note||'').trim().toLowerCase();
    const o=g[key]||(g[key]={cat:e.cat,note:e.note||'',n:0,score:0,amts:{},last:'',pay:e.paymentMethod});
    const fresh=(now-new Date(e.ts).getTime())<M30;
    o.n++;o.score+=fresh?2:1;o.amts[e.amount]=(o.amts[e.amount]||0)+(fresh?2:1);
    if(e.ts>o.last){o.last=e.ts;o.pay=e.paymentMethod;}
  });
  const out=Object.values(g)
    .filter(o=>o.n>=2&&S.categories.some(c=>c.id===o.cat))
    .sort((a,b)=>b.score-a.score||b.last.localeCompare(a.last))
    .slice(0,limit)
    .map(o=>({cat:o.cat,note:o.note,pay:o.pay,amount:+Object.entries(o.amts).sort((a,b)=>b[1]-a[1])[0][0]}));
  if(out.length<3){
    SEED_SUGG.forEach(id=>{
      if(out.length>=4||out.some(o=>o.cat===id)||!S.categories.some(c=>c.id===id))return;
      out.push({cat:id,note:'',amount:0,pay:'card'});
    });
  }
  return out;
}

/* ===================================================================
   ISTATISTIK — Chart.js
   Gerekce: proje vanilla JS ve build adimi yok. Chart.js tek <script>
   ile gelir, canvas tabanli oldugu icin dokunmatik tooltip hazir gelir.
   Recharts React gerektirirdi, tum mimari degisirdi.
   =================================================================== */
const CH_FONT={family:'Inter',size:11};
const TOK=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();

function chartReady(){ return typeof Chart!=='undefined'; }
function kill(id){ if(charts[id]){charts[id].destroy();delete charts[id];} }
function mk(id,cfg){
  const el=document.getElementById(id); if(!el||!chartReady())return;
  kill(id);
  cfg.options=Object.assign({
    responsive:true,maintainAspectRatio:false,
    interaction:{mode:'index',intersect:false},
    plugins:{
      legend:{display:false},
      tooltip:{
        backgroundColor:TOK('--navy-900'),padding:10,cornerRadius:8,
        titleFont:CH_FONT,bodyFont:CH_FONT,displayColors:true,boxPadding:4,
        callbacks:{label:c=>' '+(c.dataset.label?c.dataset.label+': ':'')+money(c.parsed.y??c.parsed)}
      }
    }
  },cfg.options||{});
  charts[id]=new Chart(el,cfg);
}
const axis=(extra)=>Object.assign({
  grid:{color:TOK('--border'),drawTicks:false},
  border:{display:false},
  ticks:{color:TOK('--text-muted'),font:CH_FONT,padding:6}
},extra||{});

/* Ozet ekranindaki mini trend */
function drawTrendChart(start,end){
  if(!chartReady())return;
  const days=Math.round((end-start)/DAY), now=new Date();
  const labels=[],data=[];let acc=0;
  for(let i=0;i<days;i++){
    const d=new Date(start);d.setDate(d.getDate()+i);
    if(d>now)break;
    const n=new Date(d);n.setDate(n.getDate()+1);
    acc+=sum(expIn(d,n));
    labels.push(d.getDate()+' '+AYK[d.getMonth()]);data.push(acc);
  }
  $('#trendHint').textContent=data.length?'kümülatif':'';
  mk('chTrend',{
    type:'line',
    data:{labels,datasets:[{
      data,borderColor:TOK('--accent'),borderWidth:2,tension:.3,
      pointRadius:0,pointHoverRadius:4,fill:true,
      backgroundColor:ctx=>{
        const {chart}=ctx;if(!chart.chartArea)return 'transparent';
        const g=chart.ctx.createLinearGradient(0,chart.chartArea.top,0,chart.chartArea.bottom);
        g.addColorStop(0,'rgba(59,111,212,.22)');g.addColorStop(1,'rgba(59,111,212,0)');return g;
      }
    }]},
    options:{scales:{x:axis({grid:{display:false}}),y:axis({ticks:{color:TOK('--text-muted'),font:CH_FONT,callback:v=>nf0.format(v)}})}}
  });
}

/* --------- aralik hesabi --------- */
function statRange(){
  const now=new Date();
  if(ui.range==='week'){const s=weekStart(now);return{s,e:new Date(Math.min(+periodEnd(s,'weekly'),+now+1)),name:'Bu hafta',len:7};}
  if(ui.range==='month'){const s=new Date(now.getFullYear(),now.getMonth(),1);return{s,e:now,name:AYLAR[now.getMonth()],len:new Date(now.getFullYear(),now.getMonth()+1,0).getDate()};}
  if(ui.range==='q'){const s=new Date(now.getFullYear(),now.getMonth()-2,1);return{s,e:now,name:'Son 3 ay',len:Math.round((now-s)/DAY)};}
  if(ui.range==='year'){const s=new Date(now.getFullYear(),0,1);return{s,e:now,name:now.getFullYear()+'',len:Math.round((now-s)/DAY)};}
  const a=ui.from?new Date(ui.from+'T00:00:00'):new Date(now.getFullYear(),now.getMonth(),1);
  const b=ui.to?new Date(ui.to+'T23:59:59'):now;
  return{s:a,e:b,name:'Özel aralık',len:Math.max(Math.round((b-a)/DAY),1)};
}
function prevRange(r){
  const span=r.e-r.s;
  return{s:new Date(+r.s-span),e:new Date(+r.s)};
}

        <span class="cdot" style="background:${c.color}1A;color:${c.color}">${svgIcon(c.icon)}</span>
        <span><span class="nm">${esc(e.note||c.name)}</span>
          <span class="pct" style="text-align:left">${dayLabel(e.ts.slice(0,10))} · ${e.paymentMethod==='cash'?'Nakit':'Kart'}</span></span>
        <span class="amt num">${money(e.amount)}</span>
      </div>`;}).join('')}</div>`:emptyState('bar','Veri yok','Bu aralıkta işlem bulunmuyor.')}
  `;
  hydrateIcons(body);

  /* --- donut --- */
  if(cats.length) mk('chDonut',{
    type:'doughnut',
    data:{labels:cats.map(x=>x.c.name),datasets:[{
      data:cats.map(x=>x.v),backgroundColor:cats.map(x=>x.c.color),
      borderWidth:2,borderColor:TOK('--surface'),hoverOffset:6
    }]},
    options:{cutout:'62%',plugins:{tooltip:{callbacks:{label:c=>' '+c.label+': '+money(c.parsed)}}}}
  });

  /* --- aylik gelir/gider --- */
  const now=new Date(),ml=[],inc=[],exp=[];
  for(let i=5;i>=0;i--){
    const s=new Date(now.getFullYear(),now.getMonth()-i,1),e=new Date(now.getFullYear(),now.getMonth()-i+1,1);
    const t=txIn(s,e);
    ml.push(AYK[s.getMonth()]);
    inc.push(sum(t.filter(x=>!isExp(x))));
    exp.push(sum(t.filter(isExp)));
  }
  mk('chBars',{
    type:'bar',
    data:{labels:ml,datasets:[
      {label:'Gelir',data:inc,backgroundColor:TOK('--success'),borderRadius:6,maxBarThickness:22},
      {label:'Gider',data:exp,backgroundColor:TOK('--accent'),borderRadius:6,maxBarThickness:22}
    ]},
    options:{plugins:{legend:{display:true,labels:{color:TOK('--text-muted'),font:CH_FONT,boxWidth:10,boxHeight:10,usePointStyle:true,pointStyle:'circle'}}},
      scales:{x:axis({grid:{display:false}}),y:axis({ticks:{color:TOK('--text-muted'),font:CH_FONT,callback:v=>nf0.format(v)}})}}
  });

  /* --- kumulatif: bu donem vs gecen donem --- */
  const cum=(a,b,n)=>{
    const out=[];let acc=0;
    for(let i=0;i<n;i++){
      const d=new Date(a);d.setDate(d.getDate()+i);
      if(d>b){out.push(null);continue;}
      const nx=new Date(d);nx.setDate(nx.getDate()+1);
      acc+=sum(expIn(d,nx));out.push(acc);
    }
    return out;
  };
  const n=Math.min(Math.max(days,2),92);
  mk('chCum',{
    type:'line',
    data:{labels:Array.from({length:n},(_,i)=>i+1+'. gün'),datasets:[
      {label:'Bu dönem',data:cum(r.s,r.e,n),borderColor:TOK('--accent'),borderWidth:2.5,pointRadius:0,pointHoverRadius:4,tension:.25,spanGaps:false},
      {label:'Geçen dönem',data:cum(pr.s,pr.e,n),borderColor:TOK('--text-muted'),borderWidth:1.5,borderDash:[5,4],pointRadius:0,pointHoverRadius:4,tension:.25}
    ]},
    options:{plugins:{legend:{display:true,labels:{color:TOK('--text-muted'),font:CH_FONT,boxWidth:14,boxHeight:2}}},
      scales:{x:axis({grid:{display:false},ticks:{color:TOK('--text-muted'),font:CH_FONT,maxTicksLimit:7}}),
              y:axis({ticks:{color:TOK('--text-muted'),font:CH_FONT,callback:v=>nf0.format(v)}})}}
  });

  /* --- kart / nakit --- */
  if(total) mk('chPay',{
    type:'bar',
    data:{labels:[''],datasets:[
      {label:'Kart',data:[card],backgroundColor:TOK('--accent'),borderRadius:6},
      {label:'Nakit',data:[cash],backgroundColor:TOK('--success'),borderRadius:6}
    ]},
    options:{indexAxis:'y',scales:{
      x:Object.assign(axis({ticks:{color:TOK('--text-muted'),font:CH_FONT,callback:v=>nf0.format(v)}}),{stacked:true}),
      y:Object.assign(axis({grid:{display:false}}),{stacked:true})
    },plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+c.dataset.label+': '+money(c.parsed.x)}}}}
  });
}

/* --------- bu hafta / gecen hafta karti (14 gunluk veri esigi) --------- */
function weekCompareHTML(){
  const span=dataSpanDays(),need=14;
  if(span<need){
    return `<div class="sec"><h2>Bu hafta / geçen hafta</h2></div>
      <div class="card">
        <div style="font-size:var(--t-sm);font-weight:600;margin-bottom:var(--s2)">${need-span} gün sonra açılıyor</div>
        <div class="track"><div class="fill" style="width:${span/need*100}%;background:var(--accent)"></div></div>
        <div class="wsub">Karşılaştırmanın anlamlı olması için iki haftalık veri gerekiyor.</div>
      </div>`;
  }
  const now=new Date(),ts=weekStart(now),ps=new Date(ts);ps.setDate(ps.getDate()-7);
  const el=Math.floor((now-ts)/DAY)+1;
  const pc=new Date(ps);pc.setDate(pc.getDate()+el);
  const cur=sum(expIn(ts,now)),prevSame=sum(expIn(ps,pc)),prevFull=sum(expIn(ps,ts));

  const agg=l=>{const m={};l.forEach(e=>m[e.cat]=(m[e.cat]||0)+e.amount);return m;};
  const a=agg(expIn(ts,now)),b=agg(expIn(ps,pc));
  const ids=[...new Set([...Object.keys(a),...Object.keys(b)])];
  const diffs=ids.map(id=>({id,d:(a[id]||0)-(b[id]||0)})).filter(x=>x.d!==0)
    .sort((x,y)=>Math.abs(y.d)-Math.abs(x.d)).slice(0,4);

  const p=prevSame>0?Math.round((cur-prevSame)/prevSame*100):null;
  const cls=p===null?'flat':Math.abs(p)<3?'flat':p>0?'up':'down';
  const ico=p===null||Math.abs(p)<3?'':(p>0?svgIcon('arrow-up','sm'):svgIcon('arrow-down','sm'));
  const txt=p===null?'yeni':Math.abs(p)<3?'sabit':'%'+Math.abs(p);

  return `<div class="sec"><h2>Bu hafta / geçen hafta</h2><span class="hint">${el}. gün</span></div>
    <div class="card">
      <div class="wtop"><b class="num">${money(cur)}</b><span class="trend ${cls}">${ico}${txt}</span></div>
      <div class="wsub">Geçen haftanın aynı gününe kadar ${money(prevSame)} · haftanın tamamı ${money(prevFull)}</div>
      ${diffs.map(x=>{const c=catById(x.id),up=x.d>0;
        return `<div class="wrow">
          <span class="k"><span class="cdot" style="background:${c.color}1A;color:${c.color}">${svgIcon(c.icon,'sm')}</span>${esc(c.name)}</span>
          <span class="v" style="color:${up?'var(--danger)':'var(--success)'}">${up?'+':'−'}${money(Math.abs(x.d))}</span>
        </div>`;}).join('')}
    </div>`;
}

/* --- kategori duzenleme --- */
function catSheet(cat){
  ui.editCat=cat;
  ui.catIcon=cat?cat.icon:'tag';
  ui.catColor=cat?cat.color:COLORS[0];
  const kind=cat?(cat.kind||'expense'):'expense';
  openSheet(`
    <h3>${cat?'Kategoriyi düzenle':'Yeni kategori'}</h3>
    <div class="field">
      <label class="lbl" for="csName">Ad</label>
      <input class="inp" id="csName" maxlength="18" value="${cat?esc(cat.name):''}" placeholder="Kategori adı">
    </div>
    <div class="field">
      <span class="lbl">Tür</span>
      <div class="seg" style="grid-template-columns:1fr 1fr" id="csKind">
        <button data-kind="expense" class="${kind==='expense'?'on':''}">Gider</button>
        <button data-kind="income" class="${kind==='income'?'on':''}">Gelir</button>
      </div>
    </div>
    <div class="field"><span class="lbl">İkon</span><div class="icgrid" id="csIcons"></div></div>
    <div class="field"><span class="lbl">Renk</span><div class="swatches" id="csColors"></div></div>
    <button class="btn" id="csSave">Kaydet</button>
    ${cat?'<button class="btn dang" id="csDel" style="margin-top:var(--s2)">Kategoriyi sil</button>':''}
  `);
  let k=kind;
  $$('#csKind button').forEach(b=>b.onclick=()=>{k=b.dataset.kind;$$('#csKind button').forEach(x=>x.classList.toggle('on',x===b));});
  const paintIcons=()=>{
    $('#csIcons').innerHTML=CAT_ICONS.map(n=>`<button class="ic-btn ${n===ui.catIcon?'on':''}" data-i="${n}">${svgIcon(n)}</button>`).join('');
    $$('#csIcons [data-i]').forEach(b=>b.onclick=()=>{ui.catIcon=b.dataset.i;paintIcons();});
  };
  const paintColors=()=>{
    $('#csColors').innerHTML=COLORS.map(c=>`<button class="sw-btn ${c===ui.catColor?'on':''}" data-c="${c}"><i style="background:${c}"></i></button>`).join('');
    $$('#csColors [data-c]').forEach(b=>b.onclick=()=>{ui.catColor=b.dataset.c;paintColors();});
  };
  paintIcons();paintColors();

  $('#csSave').onclick=async()=>{
    const name=$('#csName').value.trim();
    if(!name){toast('Kategori adı gerekiyor');return;}
    if(cat)Object.assign(cat,{name,icon:ui.catIcon,color:ui.catColor,kind:k});
    else S.categories.push({id:uid(),name,icon:ui.catIcon,color:ui.catColor,kind:k});
    await save();closeSheet();
  };
  if(cat)$('#csDel').onclick=async()=>{
    const used=S.expenses.filter(e=>e.cat===cat.id).length;
    const ok=await confirmDlg('Kategoriyi sil',
      used?used+' işlem bu kategoride. İşlemler silinmez, "Silinmiş" olarak görünür.':'Bu kategori kaldırılacak.','Sil');
    if(!ok)return;
    S.categories=S.categories.filter(c=>c.id!==cat.id);
    await save();closeSheet();toast('Kategori silindi');
  };
}

  const b=ev.target.closest('[data-editcat]');

/* ===================================================================
   BASLAT
   =================================================================== */
(async function init(){
  const saved=await Store.get();
  S=saved?Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),saved):JSON.parse(JSON.stringify(DEFAULTS));
  if(!S.settings)S.settings={...DEFAULTS.settings};
  if(!Array.isArray(S.expenses))S.expenses=[];
  if(!S.categories?.length){S.categories=JSON.parse(JSON.stringify(DEFAULTS.categories));S.settings.catSeed=3;}
  migrate();
  await Store.set(S);

  hydrateIcons(document);
  resetForm();
  const n=new Date();
  $('#rFrom').value=iso(new Date(n.getFullYear(),n.getMonth(),1));
  $('#rTo').value=iso(n);
  ui.from=$('#rFrom').value;ui.to=$('#rTo').value;

  $('#boot').remove();
  $('#app').hidden=false;
  render();

  /* Chart.js gec yuklenirse ozet grafigini tazele */
  if(!chartReady()){
    const t=setInterval(()=>{if(chartReady()){clearInterval(t);render();}},250);
    setTimeout(()=>clearInterval(t),8000);
  }

  /* PWA: yalnizca gercek origin'de */
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
